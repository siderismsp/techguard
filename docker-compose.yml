version: '3.8'

services:
  backend:
    build: ./backend
    container_name: techguard-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - techguard-data:/app/data
    environment:
      - PORT=3001
      - TECHNITIUM_URL=http://192.168.188.55:5380
      - DB_PATH=/app/data/techguard.db
    networks:
      - techguard-net

  frontend:
    build: .
    container_name: techguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - techguard-net

volumes:
  techguard-data:

networks:
  techguard-net:
    driver: bridge